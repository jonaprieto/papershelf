name: Release

# Tag a commit to publish a build: git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest

    # Secrets are lifted into the environment here because the `secrets` context is not
    # available in a step's `if:`, while `env` is. Signing and notarization are skipped
    # when they are absent, so a fork still gets an unsigned build rather than a failure.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm certificate.p12

      - name: Build the disk image
        run: ./Tools/make-dmg.sh

      - name: Notarize
        if: env.NOTARY_APPLE_ID != ''
        run: |
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls dist/*.dmg)
          shasum -a 256 "$DMG" > "$DMG.sha256"
          gh release create "${GITHUB_REF_NAME}" "$DMG" "$DMG.sha256" \
            --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Publish the cask
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d' ' -f1 "dist/PaperShelf-${VERSION}.dmg.sha256")
          TAP="$RUNNER_TEMP/homebrew-papershelf"
          gh repo clone jonaprieto/homebrew-papershelf "$TAP"
          mkdir -p "$TAP/Casks"
          cat > "$TAP/Casks/papershelf.rb" <<EOF
cask "papershelf" do
  version "${VERSION}"
  sha256 "${SHA}"

  url "https://github.com/jonaprieto/papershelf/releases/download/v#{version}/PaperShelf-#{version}.dmg"
  name "PaperShelf"
  desc "macOS PDF reader and research library"
  homepage "https://jonaprieto.github.io/papershelf/"

  app "PaperShelf.app"

  caveats <<~EOS
    PaperShelf is ad-hoc signed while notarization is on the roadmap.
    If macOS blocks the first launch, right-click PaperShelf.app in Finder and choose Open.
  EOS

  zap trash: [
    "~/Library/Application Support/PaperShelf",
    "~/Library/Preferences/com.jonaprieto.pdfhammer.plist",
  ]
end
EOF
          git -C "$TAP" config user.name "github-actions[bot]"
          git -C "$TAP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP" add Casks/papershelf.rb
          if git -C "$TAP" diff --cached --quiet; then exit 0; fi
          git -C "$TAP" commit -m "chore: update PaperShelf to ${VERSION}"
          git -C "$TAP" push origin HEAD
