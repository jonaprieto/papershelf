name: Probe
on:
  push:
    branches: [ci-probe]
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: sw_vers
      - run: swift build --build-tests
      - run: swift test --skip-build --filter "ZZProbeTests|ReaderZoomTests|CommandsTests" 2>&1 | grep -E "PROBE|error:|Executed|passed|failed"
